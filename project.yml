name: RustyNoter
options:
  bundleIdPrefix: nl.glebstarchikov
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  NoterCore:
    path: Packages/NoterCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  RustyNoter:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: NoterCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rusty Noter
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Gleb Starchikov"
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.glebstarchikov.RustyNoter
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
